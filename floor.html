  ex11: ["delta", "ds"], ex12: ["lm", "legend"], ex13: ["hp", "holon"],
  ex14: ["cg", "crystal"], ex15: ["df", "frontiers"], ex16: ["pk", "keepers"],
};
function hitsQuery(r, q) {
  const tokens = normQ(q).split(/\s+/).filter(Boolean);
  if (!tokens.length) return true;
  const num = String(r.id || "").split("-").slice(1).join("-").toLowerCase();
  const words = new Set(normQ([r.name, r.set, r.set_id, r.id, num].join(" ")).split(/\s+/));
  for (const a of (SET_ALIASES[r.set_id] || [])) words.add(a);
  return tokens.every(t => {
    if (/^\d+[a-z]?$/.test(t)) return words.has(t);
    return [...words].some(w => w === t || w.startsWith(t) || (t.length >= 3 && t.startsWith(w)));
  });
}
function usd(x){ return x==null ? "—" : "$" + Math.round(x); }
function pct(x){
  if (x==null) return "—";
  const n = Math.round(x * 100);
  if (n === 0) return "0%";
  return (n > 0 ? "+" : "−") + Math.abs(n) + "%";
}
function imgUrl(url){
  if (!url) return "";
  if (url.includes("images.pokemontcg.io") && /\.png$/i.test(url) && !url.includes("_hires"))
    return url.replace(/\.png$/i, "_hires.png");
  return url;
}
function cardImg(r){
  const url = r.img || "";
  if (!url) return "";
  const hi = imgUrl(url);
  return `<img src="${hi}" alt="${r.name||""}" loading="lazy" onerror="this.onerror=null;this.src='${url}';this.addEventListener('error',()=>this.classList.add('broken'))"/>`;
}
function heatWord(h){
  return {under:"under", over:"over", slab:"slab-only", fair:"fair", thin:"thin"}[h] || h || "thin";
}
function shown(){
  const q = document.getElementById("q").value;
  return ROWS.filter(r => {
    if (q) return hitsQuery(r, q);
    if (cut==="under" && r.heat!=="under") return false;
    if (cut==="want" && !r.want) return false;
    if (cut==="chase" && !(r.lens||[]).includes("chase")) return false;
    if (cut==="mid" && !(r.lens||[]).includes("mid")) return false;
    if (cut==="stamp" && !r.stamp) return false;
    if (cut==="over" && r.heat!=="over") return false;
    if (cut==="slab" && r.heat!=="slab") return false;
    return true;
  });
}
function verdict(ask, r){
  if (ask==null || !(ask>0) || r.bid==null) return null;
  if (r.steal!=null && ask <= r.steal) return {cls:"steal", t:"STEAL — take it"};
  if (ask <= r.bid * 1.05) return {cls:"good", t:"GOOD — in the bid"};
  if (r.nm!=null && ask <= r.nm && (r.walk==null || ask <= r.walk))
    return {cls:"nm", t:"NM-only — foil and back must pass"};
  if (r.walk!=null && ask <= r.walk) return {cls:"nm", t:"Top of range — only if clean"};
  return {cls:"walk", t: r.heat==="over" ? "WALK — overheated vs the book" : "WALK — above the book"};
}
function barPair(me, them){
  const vals = [me, them].filter(v => v!=null).map(v => Math.abs(v));
  const mx = Math.max(0.01, ...vals);
  const w = v => v==null ? 0 : Math.max(6, 100 * Math.abs(v) / mx);
  return {me, them, wm: w(me), wt: w(them)};
}
function race(r){
  const rows = [
    ["3 mo", r.r3, r.idx3],
    ["6 mo", r.r6, r.idx6],
    ["1 yr", r.r12, r.idx12],
  ];
  return `<div class="bars">${rows.map(([lab, me, them]) => {
    const b = barPair(me, them);
    return `<div>
      <div class="bar me ${me==null?"empty":""}"><span class="who">${lab}</span><div class="track">${me==null?"":`<span class="fill" style="width:${b.wm}%"></span>`}</div><span class="amt">${pct(me)}</span></div>
      <div class="bar them ${them==null?"empty":""}"><span class="who">pile</span><div class="track">${them==null?"":`<span class="fill" style="width:${b.wt}%"></span>`}</div><span class="amt">${pct(them)}</span></div>
    </div>`;
  }).join("")}</div>`;
}
function bookBox(r){
  const b = r.book || {};
  const cells = [
    ["Oracle LP", r.lp, b.lp_status, b.lp_n],
    ["Oracle NM", r.nm, b.nm_status, b.nm_n],
    ["Hist raw", r.raw, r.basis, null],
    ["PSA 10", r.px, r.card_reg, r.pop10],
  ];
  return `<div class="slab-row">${cells.map(([k,v,st,n]) =>
    `<div><span class="k">${k}${st?` · ${st}`:""}${n!=null?` · n=${n}`:""}</span><span class="v">${usd(v)}</span></div>`
  ).join("")}</div>`;
}
function asksBox(r){
  const asks = r.asks || [];
  if (!asks.length) {
    return `<p class="slab-note">No live ask tape in this freeze. Oracle LP/NM is the last fair-market book (comps mark + n). Historical raw is the PriceCharting loose print.</p>`;
  }
  return `<div class="slab-row two">${asks.slice(0,6).map(a =>
    `<div><span class="k">${a.venue||"ask"} · ${a.cond||""} · ${a.age||""}</span><span class="v">${usd(a.px)}</span></div>`
  ).join("")}</div>`;
}
function detail(r){
  const grades = [["PSA 10", r.px], ["Grade 9", r.p9], ["Grade 8", r.p8], ["Grade 7", r.p7]];
  const note = r.heat==="slab"
    ? "Cheaper grades did not follow the 10. Do not use this as raw heat."
    : r.heat==="under"
      ? "Pile still growing. This print is shorter than friends. Bid is blended LP."
      : r.heat==="over"
        ? "This name already ran vs friends. Bid is cut. Walk early."
        : "In the pack. Pay LP, not a story.";
  return `<div class="slab">
    <div class="slab-row">${grades.map(([k,v]) => `<div><span class="k">${k}</span><span class="v">${usd(v)}</span></div>`).join("")}</div>
    ${race(r)}
    ${bookBox(r)}
    ${asksBox(r)}
    <p class="slab-note">${note} 9–7 are PriceCharting mixed-grader bands.</p>
  </div>`;
}
function render(){
  const askRaw = document.getElementById("ask").value.trim();
  const ask = askRaw ? Number(askRaw) : null;
  const out = shown();
  document.getElementById("count").textContent = out.length + " cards";
  document.getElementById("list").innerHTML = out.slice(0,80).map(r => {
    const v = verdict(ask, r);
    const tags = [
      `<span class="tag ${r.heat||"thin"}">${heatWord(r.heat)}</span>`,
      (r.lens||[]).includes("chase") ? '<span class="tag chase">chase</span>' : "",
      (r.lens||[]).includes("mid") ? '<span class="tag mid">mid</span>' : "",
      r.stamp ? '<span class="tag">stamp</span>' : "",
      r.want ? '<span class="tag under">want</span>' : "",
    ].join("");
    return `<article class="row ${r.heat||""}" aria-expanded="false">
      <div class="face">${cardImg(r)}</div>
      <div>
        <div class="name">${r.name||""}</div>
        <div class="sub">${r.set||""} · ${r.tier||""} · ${r.id||""}</div>
        <div>${tags}</div>
        <div class="nums">
          <div><span class="k">steal ≤</span><span class="v steal">${usd(r.steal)}</span></div>
          <div><span class="k">bid LP</span><span class="v bid">${usd(r.bid)}</span></div>
          <div><span class="k">walk ></span><span class="v walk">${usd(r.walk)}</span></div>
        </div>
        <div class="range">range <b>${usd(r.low)}</b> – <b>${usd(r.high)}</b> · NM ${usd(r.nm)}</div>
        ${v ? `<div class="verdict ${v.cls}">${v.t}</div>` : ""}
        <button type="button" class="more">Grades + heat ▾</button>
        ${detail(r)}
      </div>
    </article>`;
  }).join("") || '<p class="empty">No match. Search a name or switch to All.</p>';
}
document.getElementById("list").addEventListener("click", e => {
  const row = e.target.closest(".row");
  if (!row) return;
  const open = !row.classList.contains("open");
  document.querySelectorAll(".row.open").forEach(r => {
    r.classList.remove("open");
    r.setAttribute("aria-expanded", "false");
    const m = r.querySelector(".more");
    if (m) m.textContent = "Grades + heat ▾";
  });
  if (open) {
    row.classList.add("open");
    row.setAttribute("aria-expanded", "true");
    const m = row.querySelector(".more");
    if (m) m.textContent = "Grades + heat ▴";
  }
});
document.getElementById("q").addEventListener("input", render);
document.getElementById("ask").addEventListener("input", render);
document.querySelectorAll(".cut").forEach(b => b.addEventListener("click", () => {
  cut = b.dataset.cut;
  document.querySelectorAll(".cut").forEach(x => x.classList.toggle("active", x===b));
  render();
}));
render();
</script>
</body>
</html>
