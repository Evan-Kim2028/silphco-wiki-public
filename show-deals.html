<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Show deals — 2026-08-12-card-screens</title>
<style>
:root{--bg:#0c0f16;--panel:#141925;--panel2:#1a2130;--text:#eef2fa;--muted:#97a1b5;--border:#2a3348;--accent:#6ea8ff;--pos:#3dd68c;--neg:#f07178;--warn:#e6b450}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;background:#0c0f16;color:var(--text);line-height:1.35}
.topbar{position:sticky;top:0;z-index:40;background:#0c0f16;border-bottom:1px solid var(--border);padding-top:env(safe-area-inset-top)}
.inner{max-width:40rem;margin:0 auto;padding:.7rem 1rem}
h1{margin:0;font-size:1.1rem}
.meta{color:var(--muted);font-size:.8rem;margin-top:.15rem}
.meta a{color:var(--accent);text-decoration:none}
.rule{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:.65rem .75rem;margin:.75rem 0;font-size:.84rem;color:var(--muted)}
.rule b{color:var(--text)}
#q{width:100%;font-size:16px;padding:.7rem .8rem;border-radius:10px;border:1px solid var(--border);background:var(--panel2);color:var(--text);min-height:44px;text-overflow:ellipsis}
.cuts{display:flex;flex-wrap:wrap;gap:.35rem;margin:.55rem 0}
.cut{appearance:none;border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:999px;padding:.4rem .7rem;font-size:.8rem;min-height:40px}
.cut.active{border-color:var(--accent);background:rgba(110,168,255,.14);color:#cfe2ff}
.ask{display:flex;gap:.45rem;align-items:center;margin:.45rem 0 .7rem}
.ask label{font-size:.78rem;color:var(--muted);white-space:nowrap}
.ask input{flex:1;min-width:0;font-size:16px;padding:.55rem .65rem;border-radius:8px;border:1px solid var(--border);background:var(--panel2);color:var(--text);min-height:44px}
.count{color:var(--muted);font-size:.78rem;margin:0 0 .4rem}
.row{display:grid;grid-template-columns:88px 1fr;gap:.65rem;align-items:start;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:.7rem .8rem;margin:.4rem 0}
.row.want{border-color:rgba(61,214,140,.35)}
.row.mine{border-color:rgba(110,168,255,.45)}
.face img{width:88px;height:122px;object-fit:contain;border-radius:6px;background:#0a0d14;outline:1px solid rgba(255,255,255,.08)}
.face img.broken{display:none}
.name{font-weight:700}
.sub{color:var(--muted);font-size:.78rem;margin-top:.1rem}
.nums{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.35rem;margin-top:.5rem;font-variant-numeric:tabular-nums}
.nums div{background:var(--panel2);border-radius:8px;padding:.35rem .4rem}
.nums .k{display:block;font-size:.62rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.nums .v{font-size:1.05rem;font-weight:700}
.v.steal{color:var(--pos)}.v.walk{color:var(--neg)}.v.bid{color:var(--accent)}
.tag{display:inline-block;font-size:.65rem;text-transform:uppercase;letter-spacing:.04em;border:1px solid var(--border);border-radius:999px;padding:.08rem .4rem;margin-right:.25rem;color:var(--muted)}
.tag.want{color:var(--pos);border-color:rgba(61,214,140,.4)}
.tag.pulled{color:var(--warn);border-color:rgba(230,180,80,.4)}
.tag.mine{color:var(--accent);border-color:rgba(110,168,255,.4)}
.verdict{margin-top:.45rem;font-size:.88rem;font-weight:700}
.verdict.steal{color:var(--pos)}.verdict.good{color:var(--accent)}.verdict.nm{color:var(--warn)}.verdict.walk{color:var(--neg)}
.empty{color:var(--muted);padding:1.5rem .2rem}
main{padding-bottom:max(2rem,env(safe-area-inset-bottom))}
html{overflow-x:clip}
@media (max-width:700px){
  body{font-size:17px}
  .inner{padding:.65rem max(.85rem,env(safe-area-inset-left)) .65rem max(.85rem,env(safe-area-inset-right))}
  h1{font-size:1.2rem}
  .meta{font-size:.88rem}
  .rule{font-size:.92rem}
  .cut{min-height:44px;font-size:.95rem}
  #q{min-height:48px}
  .ask{flex-wrap:wrap}
  .ask label{font-size:.92rem}
  .name{font-size:1.12rem}
  .row{grid-template-columns:110px 1fr}
  .face img{width:110px;height:154px}
  .sub{font-size:.95rem}
  .nums .k{font-size:.72rem}
  .nums .v{font-size:1.15rem}
  .tag{font-size:.72rem;padding:.14rem .45rem}
  .verdict{font-size:1rem}
  .count{font-size:.9rem}
}
</style>
</head>

let cut = "want";
function normQ(s) {
  return String(s || "").toLowerCase().replace(/δ/g, " delta ").replace(/[^a-z0-9]+/g, " ").trim();
}
const SET_ALIASES = {
  ex7: ["trr", "rocket"], ex8: ["deoxys"], ex9: ["emerald"], ex10: ["uf", "unseen"],
  ex11: ["delta", "ds"], ex12: ["lm", "legend"], ex13: ["hp", "holon"],
  ex14: ["cg", "crystal"], ex15: ["df", "frontiers"], ex16: ["pk", "keepers"],
};
function hitsQuery(r, q) {
  const tokens = normQ(q).split(/\s+/).filter(Boolean);
  if (!tokens.length) return true;
  const num = String(r.id || "").split("-").slice(1).join("-").toLowerCase();
  const words = new Set(normQ([r.name, r.set, r.set_id, r.id, num].join(" ")).split(/\s+/));
  for (const a of (SET_ALIASES[r.set_id] || [])) words.add(a);
  return tokens.every(t => {
    if (/^\d+[a-z]?$/.test(t)) return words.has(t);
    return [...words].some(w => w === t || w.startsWith(t) || (t.length >= 3 && t.startsWith(w)));
  });
}
function usd(x){ return x==null ? "—" : "$" + Math.round(x); }
function imgUrl(url){
  if (!url) return "";
  if (url.includes("images.pokemontcg.io") && /\.png$/i.test(url) && !url.includes("_hires"))
    return url.replace(/\.png$/i, "_hires.png");
  return url;
}
function cardImg(r){
  const url = r.img || "";
  if (!url) return "";
  const hi = imgUrl(url);
  return `<img src="${hi}" alt="${r.name||""}" loading="lazy" onerror="this.onerror=null;this.src='${url}';this.addEventListener('error',()=>this.classList.add('broken'))"/>`;
}
function verdict(ask, r){
  if (ask==null || !(ask>0)) return null;
  if (ask <= r.steal) return {cls:"steal", t:"STEAL — take it"};
  if (ask <= r.lp * 1.05) return {cls:"good", t:"GOOD — LP price"};
  if (r.nm!=null && ask <= r.nm) return {cls:"nm", t:"NM-only — pay this only if foil+back pass"};
  return {cls:"walk", t:"WALK — above LP"};
}
function shown(){
  const q = document.getElementById("q").value.trim().toLowerCase();
  return ROWS.filter(r => {
    if (cut==="want" && !r.want) return false;
    if (cut==="mine" && !r.mine) return false;
    if (cut==="stamp" && !r.stamp) return false;
    if (cut==="holo" && r.tier_id!=="base_rare_holo") return false;
    if (q && !hitsQuery(r, q)) return false;
    return true;
  });
}
function render(){
  const askRaw = document.getElementById("ask").value.trim();
  const ask = askRaw ? Number(askRaw) : null;
  const out = shown();
  document.getElementById("count").textContent = out.length + " cards";
  document.getElementById("list").innerHTML = out.slice(0,80).map(r => {
    const v = verdict(ask, r);
    const tags = [
      r.mine ? '<span class="tag mine">mine</span>' : '',
      r.want ? '<span class="tag want">want</span>' : (r.leftover ? '' : '<span class="tag pulled">pulled</span>'),
      r.stamp ? '<span class="tag">stamp</span>' : ''
    ].join("");
    return `<article class="row ${r.want?"want":""} ${r.mine?"mine":""}">
      <div class="face">${cardImg(r)}</div>
      <div>
      <div class="name">${r.name}</div>
      <div class="sub">${r.set} · ${r.tier} · ${r.id}</div>
      <div style="margin-top:.35rem">${tags}</div>
      <div class="nums">
        <div><span class="k">steal ≤</span><span class="v steal">${usd(r.steal)}</span></div>
        <div><span class="k">bid LP</span><span class="v bid">${usd(r.lp)}</span></div>
        <div><span class="k">NM only</span><span class="v">${usd(r.nm)}</span></div>
      </div>
      ${v ? `<div class="verdict ${v.cls}">${v.t}</div>` : ""}
      </div>
    </article>`;
  }).join("") || '<p class="empty">No match. Search a name or switch to All.</p>';
}
document.getElementById("q").addEventListener("input", render);
document.getElementById("ask").addEventListener("input", render);
document.querySelectorAll(".cut").forEach(b => b.addEventListener("click", () => {
  cut = b.dataset.cut;
  document.querySelectorAll(".cut").forEach(x => x.classList.toggle("active", x===b));
  render();
}));
render();
</script>
</body>
</html>
